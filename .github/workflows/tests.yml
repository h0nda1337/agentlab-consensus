name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Compile modules
        run: python -m compileall -q agentlab.py agent_names.py model_http.py repair.py repair_team.py repair_workspace.py repair_servers.py constrained.py setup_service.py setup_wizard.py
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - name: Build WPF and test without opening windows
        shell: pwsh
        run: ./Build-Desktop.ps1 -SelfTest
